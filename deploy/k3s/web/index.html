<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101311" />
    <title>Private Qwen</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #101311;
        --panel: #171b18;
        --panel-2: #20251f;
        --line: #30382f;
        --text: #f3f1e8;
        --muted: #a8afa4;
        --accent: #d9ff63;
        --accent-ink: #172000;
        --danger: #ff8c7d;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 20% -10%, #2c3923 0, transparent 38%),
          var(--bg);
        color: var(--text);
        font: 16px/1.5 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      button, input, textarea { font: inherit; }

      .app {
        width: min(840px, 100%);
        min-height: 100dvh;
        margin: 0 auto;
        padding: 18px clamp(14px, 4vw, 28px) 24px;
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        gap: 16px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand { display: flex; align-items: center; gap: 11px; }

      .mark {
        width: 38px;
        aspect-ratio: 1;
        border-radius: 13px;
        background: var(--accent);
        box-shadow: 0 0 40px #d9ff6333;
        position: relative;
      }

      .mark::after {
        content: "";
        position: absolute;
        inset: 11px;
        border: 3px solid var(--accent-ink);
        border-top-color: transparent;
        border-radius: 50%;
      }

      h1 { margin: 0; font-size: 1.05rem; letter-spacing: .01em; }
      .subtitle { margin: 1px 0 0; color: var(--muted); font-size: .78rem; }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        color: var(--muted);
        font-size: .8rem;
      }

      .status::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--accent);
        box-shadow: 0 0 10px var(--accent);
      }

      .key-card, .composer {
        border: 1px solid var(--line);
        background: color-mix(in srgb, var(--panel) 94%, transparent);
        border-radius: 18px;
      }

      .key-card { padding: 13px; }
      .key-row { display: flex; gap: 9px; }

      input, textarea {
        width: 100%;
        border: 1px solid var(--line);
        color: var(--text);
        background: var(--panel-2);
        outline: none;
      }

      input:focus, textarea:focus { border-color: #71823e; box-shadow: 0 0 0 3px #d9ff6310; }
      input { min-width: 0; border-radius: 11px; padding: 10px 12px; }

      button {
        border: 0;
        border-radius: 11px;
        padding: 10px 15px;
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 750;
        cursor: pointer;
      }

      button:disabled { opacity: .45; cursor: not-allowed; }
      .key-help { margin: 8px 2px 0; color: var(--muted); font-size: .76rem; }

      #chat {
        min-height: 240px;
        overflow-y: auto;
        padding: 8px 2px;
        display: flex;
        flex-direction: column;
        gap: 13px;
        scroll-behavior: smooth;
      }

      .empty {
        margin: auto;
        max-width: 520px;
        text-align: center;
        color: var(--muted);
      }

      .empty strong { display: block; color: var(--text); font-size: clamp(1.35rem, 5vw, 2rem); margin-bottom: 6px; }

      .message {
        max-width: 88%;
        padding: 12px 14px;
        border-radius: 16px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .user { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; }
      .assistant { align-self: flex-start; background: var(--panel-2); border: 1px solid var(--line); border-bottom-left-radius: 5px; }
      .error { color: var(--danger); }

      details { margin-top: 10px; color: var(--muted); font-size: .82rem; }
      details div { margin-top: 6px; white-space: pre-wrap; }

      .composer { padding: 10px; }
      textarea { min-height: 82px; max-height: 220px; resize: vertical; border: 0; background: transparent; padding: 5px 6px; }
      textarea:focus { box-shadow: none; }

      .composer-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 7px; }
      .hint { color: var(--muted); font-size: .75rem; }
      #send { min-width: 94px; }

      @media (max-width: 520px) {
        .app { padding-top: 14px; gap: 12px; }
        .key-row { align-items: stretch; }
        .key-row button { padding-inline: 12px; }
        .message { max-width: 94%; }
        .hint { display: none; }
        #send { margin-left: auto; }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <header>
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div>
            <h1>Private Qwen</h1>
            <p class="subtitle">Qwen3 0.6B · running on your GPU</p>
          </div>
        </div>
        <span class="status">Online</span>
      </header>

      <section class="key-card" aria-label="API key">
        <div class="key-row">
          <input id="apiKey" type="password" autocomplete="off" placeholder="Paste your SGLang API key" aria-label="SGLang API key" />
          <button id="saveKey" type="button">Use key</button>
        </div>
        <p class="key-help">Saved only for this browser tab. It is never included in the page.</p>
      </section>

      <section id="chat" aria-live="polite">
        <div class="empty" id="empty">
          <strong>Your model, from anywhere.</strong>
          Enter your API key, then ask Qwen anything.
        </div>
      </section>

      <form class="composer" id="composer">
        <textarea id="prompt" placeholder="Message Qwen…" aria-label="Message" required></textarea>
        <div class="composer-footer">
          <span class="hint">Enter to send · Shift+Enter for a new line</span>
          <button id="send" type="submit">Send</button>
        </div>
      </form>
    </main>

    <script>
      const apiKeyInput = document.querySelector('#apiKey');
      const saveKeyButton = document.querySelector('#saveKey');
      const composer = document.querySelector('#composer');
      const promptInput = document.querySelector('#prompt');
      const sendButton = document.querySelector('#send');
      const chat = document.querySelector('#chat');
      const empty = document.querySelector('#empty');
      const messages = [];

      apiKeyInput.value = sessionStorage.getItem('sglangApiKey') || '';

      function saveKey() {
        const key = apiKeyInput.value.trim();
        if (key) {
          sessionStorage.setItem('sglangApiKey', key);
          saveKeyButton.textContent = 'Saved';
          setTimeout(() => saveKeyButton.textContent = 'Use key', 1200);
          promptInput.focus();
        }
      }

      function addMessage(text, role, reasoning = '') {
        empty?.remove();
        const bubble = document.createElement('article');
        bubble.className = `message ${role}`;
        bubble.textContent = text;
        if (reasoning) {
          const details = document.createElement('details');
          const summary = document.createElement('summary');
          const thought = document.createElement('div');
          summary.textContent = 'Show reasoning';
          thought.textContent = reasoning;
          details.append(summary, thought);
          bubble.append(details);
        }
        chat.append(bubble);
        chat.scrollTop = chat.scrollHeight;
        return bubble;
      }

      async function submitPrompt(event) {
        event.preventDefault();
        const apiKey = apiKeyInput.value.trim() || sessionStorage.getItem('sglangApiKey');
        const prompt = promptInput.value.trim();
        if (!apiKey) {
          apiKeyInput.focus();
          apiKeyInput.setAttribute('aria-invalid', 'true');
          return;
        }
        if (!prompt) return;

        sessionStorage.setItem('sglangApiKey', apiKey);
        apiKeyInput.setAttribute('aria-invalid', 'false');
        messages.push({ role: 'user', content: prompt });
        addMessage(prompt, 'user');
        promptInput.value = '';
        sendButton.disabled = true;
        sendButton.textContent = 'Thinking…';
        const pending = addMessage('Thinking…', 'assistant');

        try {
          const response = await fetch('/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${apiKey}`,
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({
              model: 'qwen3-0.6b',
              messages,
              max_tokens: 768,
              temperature: 0.6,
              stream: false
            })
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data.message || data.detail || `Request failed (${response.status})`);
          const result = data.choices?.[0]?.message || {};
          const answer = result.content || 'The model returned no final answer.';
          messages.push({ role: 'assistant', content: answer });
          pending.remove();
          addMessage(answer, 'assistant', result.reasoning_content || '');
        } catch (error) {
          pending.textContent = error.message || 'Could not reach the model.';
          pending.classList.add('error');
        } finally {
          sendButton.disabled = false;
          sendButton.textContent = 'Send';
          promptInput.focus();
        }
      }

      saveKeyButton.addEventListener('click', saveKey);
      composer.addEventListener('submit', submitPrompt);
      promptInput.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
          event.preventDefault();
          composer.requestSubmit();
        }
      });
    </script>
  </body>
</html>
